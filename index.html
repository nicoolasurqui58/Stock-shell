<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stock Shell — Mi Estación</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#f1f5f9; --mut:#94a3b8;
    --verde:#22c55e; --rojo:#ef4444; --azul:#3b82f6; --ambar:#f59e0b; --violeta:#8b5cf6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(135deg,#0e7490,#155e75);
    padding:14px 16px 12px; box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  header h1{margin:0; font-size:19px; font-weight:800; letter-spacing:.3px}
  header .fecha{font-size:12.5px; color:#a5f3fc; margin-top:2px}
  main{padding:12px 12px 20px; max-width:560px; margin:0 auto}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .card h2{margin:0 0 10px; font-size:15px; font-weight:700; color:#7dd3fc; text-transform:uppercase; letter-spacing:.6px}
  .big{font-size:26px; font-weight:800; letter-spacing:.3px}
  .mut{color:var(--mut); font-size:13px}
  .verde{color:var(--verde)} .rojo{color:var(--rojo)} .ambar{color:var(--ambar)} .azul{color:#60a5fa} .violeta{color:#c4b5fd}
  .row{display:flex; align-items:center; gap:10px}
  .between{justify-content:space-between}
  .grow{flex:1; min-width:0}

  .tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    display:flex; background:#0b1220; border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabs button{
    flex:1; background:none; border:none; color:var(--mut); font-size:11px; font-weight:600;
    padding:8px 0 10px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  }
  .tabs button span.ico{font-size:22px; line-height:1}
  .tabs button.act{color:#7dd3fc}

  .btn{
    border:none; border-radius:10px; padding:11px 16px; font-size:15px; font-weight:700; color:#fff;
    cursor:pointer; background:var(--panel2); min-height:44px;
  }
  .btn:active{filter:brightness(1.2)}
  .btn.ok{background:var(--verde)} .btn.azul{background:var(--azul)} .btn.violeta{background:var(--violeta)}
  .btn.rojo{background:var(--rojo)} .btn.ambar{background:var(--ambar); color:#1c1917}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--mut)}
  .btn.grande{width:100%; padding:14px; font-size:17px}
  .btn:disabled{opacity:.4}

  .prodc{display:flex; align-items:center; gap:10px; background:var(--panel2); border-radius:12px; padding:10px; margin-bottom:8px}
  .prodc .info{flex:1; min-width:0}
  .prodc .nom{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .prodc .pre{font-size:12.5px; color:var(--mut)}
  .prodc .qty{
    min-width:44px; text-align:center; font-size:19px; font-weight:800;
    background:#0b1220; border-radius:8px; padding:7px 6px;
  }
  .qty.bajo{color:var(--ambar)} .qty.cero{color:var(--rojo)}
  .plus,.minus{
    width:46px; height:46px; border-radius:12px; border:none; font-size:24px; font-weight:800; color:#fff; cursor:pointer;
  }
  .plus{background:var(--verde)} .minus{background:var(--rojo)}
  .plus:active,.minus:active{filter:brightness(1.25)}

  input,select,textarea{
    background:#0b1220; border:1px solid var(--line); color:var(--txt); border-radius:10px;
    padding:11px 12px; font-size:16px; width:100%; font-family:inherit;
  }
  input:focus,select:focus{outline:2px solid #0ea5e9; border-color:transparent}
  label{font-size:12.5px; color:var(--mut); font-weight:600; display:block; margin:8px 0 4px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

  .vta{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line)}
  .vta:last-child{border-bottom:none}
  .vta .del{background:none; border:none; color:var(--rojo); font-size:20px; padding:6px; cursor:pointer}
  .tag{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:99px; letter-spacing:.4px}
  .tag.mp{background:rgba(139,92,246,.2); color:#c4b5fd}
  .tag.ef{background:rgba(34,197,94,.18); color:var(--verde)}
  .tag.nf{background:rgba(245,158,11,.2); color:var(--ambar)}

  .metodos{display:flex; gap:8px}
  .metodos button{
    flex:1; padding:11px; border-radius:10px; border:2px solid var(--line); background:#0b1220;
    color:var(--mut); font-weight:700; font-size:14px; cursor:pointer;
  }
  .metodos button.ef.sel{border-color:var(--verde); color:var(--verde)}
  .metodos button.mp.sel{border-color:var(--violeta); color:#c4b5fd}

  dialog{
    background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:16px;
    width:min(92vw,400px); padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  dialog::backdrop{background:rgba(0,0,0,.65)}
  dialog h3{margin:0 0 12px; font-size:17px}
  .acciones{display:flex; gap:10px; margin-top:16px}
  .acciones .btn{flex:1}
  .resline{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:15px}
  .resline:last-child{border-bottom:none}
  .resline b{font-size:16px}
  .toast{
    position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:#052e16; color:#86efac; border:1px solid #166534; padding:10px 20px; border-radius:99px;
    font-size:14px; font-weight:700; z-index:50; opacity:0; transition:opacity .25s; pointer-events:none;
    max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1}
  .vacío{text-align:center; color:var(--mut); padding:18px 0; font-size:14px}
  .hist{padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px}
  .hist:last-child{border-bottom:none}
</style>
</head>
<body>

<header>
  <h1>⛽ Stock Shell</h1>
  <div class="fecha" id="fecha"></div>
</header>

<main id="vista"></main>

<nav class="tabs">
  <button data-v="stock" class="act"><span class="ico">📦</span>Stock</button>
  <button data-v="ventas"><span class="ico">🛒</span>Ventas</button>
  <button data-v="comb"><span class="ico">⛽</span>Combustible</button>
  <button data-v="dia"><span class="ico">💰</span>Resumen</button>
</nav>

<div class="toast" id="toast"></div>

<!-- Modal: agregar / editar producto -->
<dialog id="mProd">
  <h3 id="mProdTitulo">Producto</h3>
  <label>Nombre</label>
  <input id="fNombre" placeholder="Ej: Aceite 20W-50 x 1L" maxlength="60">
  <div class="grid2">
    <div>
      <label>Cantidad en stock</label>
      <input id="fCant" type="number" inputmode="decimal" step="any" min="0" placeholder="0">
    </div>
    <div>
      <label>Precio unitario ($)</label>
      <input id="fPrecio" type="text" inputmode="decimal" placeholder="0,00">
    </div>
  </div>
  <div class="acciones">
    <button class="btn ghost" id="mProdCancelar">Cancelar</button>
    <button class="btn ok" id="mProdGuardar">Guardar</button>
  </div>
</dialog>

<!-- Modal: nueva venta -->
<dialog id="mVenta">
  <h3>Nueva venta</h3>
  <label>Producto / descripción</label>
  <input id="vDesc" list="listaProd" placeholder="Elegí o escribí…" maxlength="60">
  <datalist id="listaProd"></datalist>
  <div class="grid2">
    <div>
      <label>Cantidad</label>
      <input id="vCant" type="number" inputmode="decimal" step="any" min="0" value="1">
    </div>
    <div>
      <label>Precio unitario ($)</label>
      <input id="vPrecio" type="text" inputmode="decimal" placeholder="0,00">
    </div>
  </div>
  <label>Cobro</label>
  <div class="metodos">
    <button class="ef sel" id="vEf">💵 Efectivo</button>
    <button class="mp" id="vMp">🟣 Mercado Pago</button>
  </div>
  <div class="row between" style="margin-top:12px; background:#0b1220; border-radius:10px; padding:12px">
    <span class="mut">Total</span><b class="big" id="vTotal" style="font-size:22px">$ 0,00</b>
  </div>
  <div class="acciones">
    <button class="btn ghost" id="mVentaCancelar">Cancelar</button>
    <button class="btn ok" id="mVentaGuardar">Registrar</button>
  </div>
</dialog>

<!-- Modal: carga de combustible -->
<dialog id="mComb">
  <h3>Carga de combustible</h3>
  <label>Tipo</label>
  <select id="cTipo">
    <option value="Nafta Súper">Nafta Súper</option>
    <option value="Nafta Premium">Nafta Premium</option>
    <option value="Diésel">Diésel</option>
  </select>
  <label>Litros</label>
  <input id="cLitros" type="number" inputmode="decimal" step="any" min="0" placeholder="0">
  <label>Cobro</label>
  <div class="metodos">
    <button class="ef sel" id="cEf">💵 Efectivo</button>
    <button class="mp" id="cMp">🟣 Mercado Pago</button>
  </div>
  <div class="row between" style="margin-top:12px; background:#0b1220; border-radius:10px; padding:12px">
    <span class="mut">Total</span><b id="cTotal" style="font-size:22px">$ 0,00</b>
  </div>
  <div class="acciones">
    <button class="btn ghost" id="mCombCancelar">Cancelar</button>
    <button class="btn ok" id="mCombGuardar">Registrar</button>
  </div>
</dialog>

<!-- Modal: confirmar cierre de día -->
<dialog id="mCerrar">
  <h3>Cerrar el día</h3>
  <p class="mut" style="font-size:14px; line-height:1.5">Se guarda el resumen de hoy en el historial y arranca el día de nuevo en cero. El stock <b>no</b> se toca.</p>
  <div id="cierreResumen"></div>
  <div class="acciones">
    <button class="btn ghost" id="mCerrarCancelar">Cancelar</button>
    <button class="btn ok" id="mCerrarOk">Cerrar día</button>
  </div>
</dialog>

<script>
'use strict';

const LS = 'stockshell_v1';
const $  = s => document.querySelector(s);

let db = null;
let metodoVenta = 'efectivo', metodoComb = 'efectivo';
let editProdId = null, descVentaSel = '';

const fmt = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n||0);
const fmtN = n => new Intl.NumberFormat('es-AR',{maximumFractionDigits:2}).format(n||0);
const num = v => {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v).trim().replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const hoyISO = () => new Date().toISOString().slice(0,10);
const FECHAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES  = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function base(){
  return {
    productos: [
      {id:uid(), nombre:'Aceite 20W-50 x 1L',  cant:12, precio:14500},
      {id:uid(), nombre:'Aceite 15W-40 x 1L',  cant:10, precio:15200},
      {id:uid(), nombre:'Filtro de aceite',    cant:8,  precio:6800},
      {id:uid(), nombre:'Filtro de aire',      cant:6,  precio:9200},
      {id:uid(), nombre:'Filtro de nafta',     cant:5,  precio:7500},
      {id:uid(), nombre:'Cinta aisladora',     cant:20, precio:1500},
      {id:uid(), nombre:'Cinta de embalar',    cant:15, precio:2300},
      {id:uid(), nombre:'Látex negro x 250g',  cant:7,  precio:4200},
    ],
    preciosComb: {'Nafta Súper':1099, 'Nafta Premium':1249, 'Diésel':1129},
    ventas: [],
    comisionMP: 3.19,
    historial: []
  };
}
function cargar(){
  try{
    const d = JSON.parse(localStorage.getItem(LS));
    if (d && Array.isArray(d.productos)) return Object.assign(base(), d);
  }catch(e){}
  return base();
}
function guardar(){ localStorage.setItem(LS, JSON.stringify(db)); }

function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- helpers de datos ---------- */
const delDia = () => db.ventas.filter(v => v.fecha === hoyISO());
const totalMetodo = m => delDia().filter(v=>v.metodo===m).reduce((a,v)=>a+v.total,0);
const totalComb   = () => delDia().filter(v=>v.comb).reduce((a,v)=>a+v.total,0);
const totalDia    = () => delDia().reduce((a,v)=>a+v.total,0);

/* ---------- pestañas ---------- */
let vistaActual = 'stock';
document.querySelectorAll('.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>{
    vistaActual = b.dataset.v;
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('act', x===b));
    render();
    window.scrollTo(0,0);
  });
});

function render(){
  $('#fecha').textContent = (()=>{
    const d = new Date();
    return `${FECHAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]} — ${totalDia()>0?'Vendido: '+fmt(totalDia()):'sin ventas todavía'}`;
  })();
  ({stock:vStock, ventas:vVentas, comb:vComb, dia:vDia})[vistaActual]();
}

/* ---------- STOCK ---------- */
function vStock(){
  const m = $('#vista');
  if (!db.productos.length){
    m.innerHTML = `<div class="card"><div class="vacío">No hay productos todavía.<br>Tocá “+ Agregar producto” para empezar.</div>
      <button class="btn ok grande" onclick="abrirProd()">+ Agregar producto</button></div>`;
    return;
  }
  m.innerHTML = `
    <div class="card">
      <div class="row between">
        <h2>📦 Stock <span class="mut" style="text-transform:none">(${db.productos.length})</span></h2>
        <span class="mut" style="font-size:12px">tocá el nombre para editar</span>
      </div>
      <div id="listaProd2"></div>
    </div>
    <button class="btn ok grande" onclick="abrirProd()">+ Agregar producto</button>`;
  const cont = $('#listaProd2');
  db.productos.forEach(p=>{
    const d = document.createElement('div');
    d.className = 'prodc';
    const cls = p.cant<=0 ? 'cero' : p.cant<=3 ? 'bajo' : '';
    d.innerHTML = `
      <div class="info" data-edit="${p.id}">
        <div class="nom">${esc(p.nombre)}</div>
        <div class="pre">${fmt(p.precio)} c/u</div>
      </div>
      <div class="qty ${cls}">${fmtN(p.cant)}</div>
      <button class="minus" aria-label="restar">−</button>
      <button class="plus"  aria-label="sumar">+</button>`;
    d.querySelector('.plus').onclick  = ()=>{ p.cant = +(p.cant+1).toFixed(2); guardar(); render(); };
    d.querySelector('.minus').onclick = ()=>{ p.cant = Math.max(0, +(p.cant-1).toFixed(2)); guardar(); render(); };
    d.querySelector('[data-edit]').onclick = ()=>abrirProd(p.id);
    cont.appendChild(d);
  });
}

function abrirProd(id){
  editProdId = id || null;
  const p = id ? db.productos.find(x=>x.id===id) : null;
  $('#mProdTitulo').textContent = p ? 'Editar producto' : 'Nuevo producto';
  $('#fNombre').value = p ? p.nombre : '';
  $('#fCant').value   = p ? p.cant : '';
  $('#fPrecio').value = p ? String(p.precio).replace('.',',') : '';
  $('#mProd').showModal();
  setTimeout(()=>$('#fNombre').focus(), 50);
}
$('#mProdCancelar').onclick = ()=>$('#mProd').close();
$('#mProdGuardar').onclick = ()=>{
  const n = $('#fNombre').value.trim();
  if (!n){ toast('Poné un nombre'); return; }
  const c = num($('#fCant').value), pr = num($('#fPrecio').value);
  if (editProdId){
    const p = db.productos.find(x=>x.id===editProdId);
    Object.assign(p, {nombre:n, cant:c, precio:pr});
  } else {
    db.productos.push({id:uid(), nombre:n, cant:c, precio:pr});
  }
  guardar(); $('#mProd').close(); render(); toast('Guardado ✓');
};

/* ---------- VENTAS ---------- */
function vVentas(){
  const tE = totalMetodo('efectivo'), tM = totalMetodo('mp');
  const netoM = tM * (1 - db.comisionMP/100);
  const lista = delDia().slice().reverse();
  $('#vista').innerHTML = `
    <div class="card">
      <div class="row between"><h2>🛒 Ventas de hoy</h2><button class="btn ok" onclick="abrirVenta()">+ Venta</button></div>
      <div class="row between" style="margin:6px 0"><span class="mut">💵 Efectivo</span><b class="verde">${fmt(tE)}</b></div>
      <div class="row between"><span class="mut">🟣 Mercado Pago</span><b class="violeta">${fmt(tM)}</b></div>
      <div class="row between mut" style="font-size:12.5px"><span>&nbsp;&nbsp;neto (comisión ${String(db.comisionMP).replace('.',',')}%)</span><span>${fmt(netoM)}</span></div>
      <div class="row between" style="border-top:1px solid var(--line); margin-top:8px; padding-top:10px">
        <b>TOTAL DEL DÍA</b><b class="big azul">${fmt(totalDia())}</b>
      </div>
    </div>
    <div class="card">
      <h2>Detalle</h2>
      <div id="listaVtas">${lista.length ? '' : '<div class="vacío">Todavía no registraste ventas hoy.</div>'}</div>
    </div>`;
  const c = $('#listaVtas');
  lista.forEach(v=>{
    const d = document.createElement('div');
    d.className = 'vta';
    d.innerHTML = `
      <div class="grow">
        <div style="font-weight:700; font-size:14.5px">${esc(v.desc)}</div>
        <div class="mut" style="font-size:12px">${fmtN(v.cant)} × ${fmt(v.unit)}</div>
      </div>
      <span class="tag ${v.comb?'nf':(v.metodo==='mp'?'mp':'ef')}">${v.comb?'⛽ '+(v.metodo==='mp'?'MP':'EF'):(v.metodo==='mp'?'MP':'EF')}</span>
      <b style="min-width:90px; text-align:right">${fmt(v.total)}</b>
      <button class="del" title="borrar">✕</button>`;
    d.querySelector('.del').onclick = ()=>{
      if (!confirm('¿Borrar esta venta?')) return;
      if (v.prodId){
        const p = db.productos.find(x=>x.id===v.prodId);
        if (p) p.cant = +(p.cant + v.cant).toFixed(2);
      }
      db.ventas = db.ventas.filter(x=>x.id!==v.id);
      guardar(); render();
    };
    c.appendChild(d);
  });
}

function abrirVenta(){
  metodoVenta = 'efectivo';
  $('#vDesc').value = ''; $('#vCant').value = 1; $('#vPrecio').value = '';
  $('#vEf').classList.add('sel'); $('#vMp').classList.remove('sel');
  $('#listaProd').innerHTML = db.productos.map(p=>`<option value="${esc(p.nombre)}">`).join('');
  $('#mVenta').showModal();
  setTimeout(()=>$('#vDesc').focus(), 50);
}
$('#vDesc').addEventListener('change', ()=>{
  const p = db.productos.find(x=>x.nombre === $('#vDesc').value);
  if (p) $('#vPrecio').value = String(p.precio).replace('.',',');
  calcVta();
});
function calcVta(){ $('#vTotal').textContent = fmt(num($('#vCant').value) * num($('#vPrecio').value)); }
['vCant','vPrecio'].forEach(id=>$('#'+id).addEventListener('input', calcVta));
$('#vEf').onclick = ()=>{ metodoVenta='efectivo'; $('#vEf').classList.add('sel'); $('#vMp').classList.remove('sel'); };
$('#vMp').onclick = ()=>{ metodoVenta='mp'; $('#vMp').classList.add('sel'); $('#vEf').classList.remove('sel'); };
$('#mVentaCancelar').onclick = ()=>$('#mVenta').close();
$('#mVentaGuardar').onclick = ()=>{
  const desc = $('#vDesc').value.trim();
  const cant = num($('#vCant').value), unit = num($('#vPrecio').value);
  if (!desc || cant<=0 || unit<=0){ toast('Completá descripción, cantidad y precio'); return; }
  const p = db.productos.find(x=>x.nombre.toLowerCase() === desc.toLowerCase());
  if (p){
    if (p.cant < cant) toast('Ojo: solo quedan ' + fmtN(p.cant) + ' de ' + p.nombre);
    p.cant = Math.max(0, +(p.cant - cant).toFixed(2));
  }
  db.ventas.push({id:uid(), fecha:hoyISO(), hora:new Date().toTimeString().slice(0,5),
    desc, cant, unit, total:+(cant*unit).toFixed(2), metodo:metodoVenta, prodId:p?p.id:null, comb:false});
  guardar(); $('#mVenta').close(); render(); toast('Venta registrada ✓');
};

/* ---------- COMBUSTIBLE ---------- */
function vComb(){
  const tip = ['Nafta Súper','Nafta Premium','Diésel'];
  const vendido = {};
  delDia().filter(v=>v.comb).forEach(v=>vendido[v.desc]=(vendido[v.desc]||0)+v.cant);
  $('#vista').innerHTML = `
    <div class="card">
      <h2>⛽ Precios por litro</h2>
      ${tip.map(t=>`
        <label>${t}</label>
        <input type="text" inputmode="decimal" data-precio="${t}" value="${String(db.preciosComb[t]).replace('.',',')}">
      `).join('')}
      <button class="btn ambar grande" style="margin-top:12px" onclick="abrirComb()">+ Registrar carga</button>
    </div>
    <div class="card">
      <h2>Litros vendidos hoy</h2>
      ${tip.map(t=>`<div class="row between"><span class="mut">${t}</span><b>${fmtN(vendido[t]||0)} L</b></div>`).join('')}
      <div class="row between" style="border-top:1px solid var(--line); margin-top:8px; padding-top:10px">
        <b>Total combustible</b><b class="big ambar" style="font-size:22px">${fmt(totalComb())}</b>
      </div>
    </div>`;
  document.querySelectorAll('[data-precio]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      db.preciosComb[inp.dataset.precio] = num(inp.value);
      guardar(); toast('Precio actualizado ✓');
    });
  });
}
function abrirComb(){
  metodoComb = 'efectivo';
  $('#cTipo').value = 'Nafta Súper'; $('#cLitros').value = '';
  $('#cEf').classList.add('sel'); $('#cMp').classList.remove('sel');
  calcComb(); $('#mComb').showModal(); setTimeout(()=>$('#cLitros').focus(), 50);
}
function calcComb(){
  const t = num($('#cLitros').value) * (db.preciosComb[$('#cTipo').value]||0);
  $('#cTotal').textContent = fmt(t);
}
$('#cTipo').addEventListener('change', calcComb);
$('#cLitros').addEventListener('input', calcComb);
$('#cEf').onclick = ()=>{ metodoComb='efectivo'; $('#cEf').classList.add('sel'); $('#cMp').classList.remove('sel'); };
$('#cMp').onclick = ()=>{ metodoComb='mp'; $('#cMp').classList.add('sel'); $('#cEf').classList.remove('sel'); };
$('#mCombCancelar').onclick = ()=>$('#mComb').close();
$('#mCombGuardar').onclick = ()=>{
  const lit = num($('#cLitros').value);
  if (lit<=0){ toast('Poné los litros'); return; }
  const tipo = $('#cTipo').value, pre = db.preciosComb[tipo]||0;
  db.ventas.push({id:uid(), fecha:hoyISO(), hora:new Date().toTimeString().slice(0,5),
    desc:tipo, cant:lit, unit:pre, total:+(lit*pre).toFixed(2), metodo:metodoComb, prodId:null, comb:true});
  guardar(); $('#mComb').close(); render(); toast('Carga registrada ✓');
};

/* ---------- RESUMEN / DÍA ---------- */
function vDia(){
  const tE = totalMetodo('efectivo'), tM = totalMetodo('mp');
  const tC = totalComb(), tG = totalDia();
  const valStock = db.productos.reduce((a,p)=>a + p.cant*p.precio, 0);
  $('#vista').innerHTML = `
    <div class="card">
      <h2>💰 Resumen de hoy</h2>
      <div class="resline"><span class="mut">💵 Efectivo</span><b class="verde">${fmt(tE)}</b></div>
      <div class="resline"><span class="mut">🟣 Mercado Pago</span><b class="violeta">${fmt(tM)}</b></div>
      <div class="resline"><span class="mut">&nbsp;&nbsp;neto MP (comisión ${String(db.comisionMP).replace('.',',')}%)</span><span class="mut">${fmt(tM*(1-db.comisionMP/100))}</span></div>
      <div class="resline"><span class="mut">⛽ Combustible</span><b class="ambar">${fmt(tC)}</b></div>
      <div class="resline"><span> TOTAL DEL DÍA</span><b class="big azul">${fmt(tG)}</b></div>
      <div class="resline"><span class="mut">📦 Valor del stock</span><b>${fmt(valStock)}</b></div>
    </div>
    <div class="card">
      <h2>⚙️ Ajustes</h2>
      <label>Comisión Mercado Pago (%)</label>
      <input type="text" inputmode="decimal" id="confMP" value="${String(db.comisionMP).replace('.',',')}">
      <div class="grid2" style="margin-top:12px">
        <button class="btn azul" onclick="exportar()">⬇ Exportar CSV</button>
        <button class="btn ghost" onclick="backup()">💾 Copia JSON</button>
      </div>
    </div>
    <div class="card">
      <h2>🗓 Historial</h2>
      <div id="hist">${db.historial.length ? '' : '<div class="vacío">Cerrá el día y acá va a quedar guardado.</div>'}</div>
    </div>
    <button class="btn rojo grande" onclick="pedirCierre()" ${delDia().length? '':'disabled'}>Cerrar el día</button>`;
  $('#confMP').addEventListener('change', e=>{ db.comisionMP = num(e.target.value); guardar(); toast('Comisión guardada ✓'); });
  const h = $('#hist');
  db.historial.slice().reverse().forEach(r=>{
    const d = document.createElement('div');
    d.className = 'hist';
    d.innerHTML = `<b>${r.fecha}</b>
      <div class="mut" style="font-size:12.5px">EF ${fmt(r.efectivo)} · MP ${fmt(r.mp)} · Comb ${fmt(r.comb)}</div>
      <b class="azul">Total: ${fmt(r.total)}</b>`;
    h.appendChild(d);
  });
}
function pedirCierre(){
  $('#cierreResumen').innerHTML = `
    <div class="resline"><span class="mut">Efectivo</span><b>${fmt(totalMetodo('efectivo'))}</b></div>
    <div class="resline"><span class="mut">Mercado Pago</span><b>${fmt(totalMetodo('mp'))}</b></div>
    <div class="resline"><span class="mut">Combustible</span><b>${fmt(totalComb())}</b></div>
    <div class="resline"><span><b>Total</b></span><b class="verde big" style="font-size:20px">${fmt(totalDia())}</b></div>`;
  $('#mCerrar').showModal();
}
$('#mCerrarCancelar').onclick = ()=>$('#mCerrar').close();
$('#mCerrarOk').onclick = ()=>{
  db.historial.push({fecha:hoyISO(), efectivo:totalMetodo('efectivo'), mp:totalMetodo('mp'),
    comb:totalComb(), total:totalDia(), ventas:delDia().length});
  db.ventas = db.ventas.filter(v=>v.fecha !== hoyISO());
  guardar(); $('#mCerrar').close(); render(); toast('Día cerrado ✓');
};
function exportar(){
  const filas = [['Fecha','Hora','Descripción','Cantidad','Precio unit.','Total','Método','Combustible']];
  db.ventas.forEach(v=>filas.push([v.fecha,v.hora,v.desc,v.cant,v.unit,v.total,v.metodo==='mp'?'Mercado Pago':'Efectivo',v.comb?'Sí':'No']));
  const csv = filas.map(f=>f.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'ventas_' + hoyISO() + '.csv';
  a.click();
}
function backup(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db,null,2)], {type:'application/json'}));
  a.download = 'backup_stockshell_' + hoyISO() + '.json';
  a.click();
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

db = cargar();
render();
</script>
</body>
</html>
