<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stock Shell — Planilla de turno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#f1f5f9; --mut:#94a3b8;
    --verde:#22c55e; --rojo:#ef4444; --azul:#3b82f6; --ambar:#f59e0b; --violeta:#8b5cf6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(135deg,#0e7490,#155e75);
    padding:14px 16px 12px; box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  header h1{margin:0; font-size:19px; font-weight:800; letter-spacing:.3px}
  header .fecha{font-size:12.5px; color:#a5f3fc; margin-top:2px}
  main{padding:12px 12px 20px; max-width:560px; margin:0 auto}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .card h2{margin:0 0 10px; font-size:15px; font-weight:700; color:#7dd3fc; text-transform:uppercase; letter-spacing:.6px}
  .big{font-size:26px; font-weight:800; letter-spacing:.3px}
  .mut{color:var(--mut); font-size:13px}
  .verde{color:var(--verde)} .rojo{color:var(--rojo)} .ambar{color:var(--ambar)} .azul{color:#60a5fa} .violeta{color:#c4b5fd}
  .row{display:flex; align-items:center; gap:10px}
  .between{justify-content:space-between}
  .grow{flex:1; min-width:0}

  .tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    display:flex; background:#0b1220; border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabs button{
    flex:1; background:none; border:none; color:var(--mut); font-size:10px; font-weight:600;
    padding:8px 0 10px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  }
  .tabs button span.ico{font-size:22px; line-height:1}
  .tabs button.act{color:#7dd3fc}

  .btn{
    border:none; border-radius:10px; padding:11px 16px; font-size:15px; font-weight:700; color:#fff;
    cursor:pointer; background:var(--panel2); min-height:44px;
  }
  .btn:active{filter:brightness(1.2)}
  .btn.ok{background:var(--verde)} .btn.azul{background:var(--azul)} .btn.violeta{background:var(--violeta)}
  .btn.rojo{background:var(--rojo)} .btn.ambar{background:var(--ambar); color:#1c1917}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--mut)}
  .btn.grande{width:100%; padding:14px; font-size:17px}
  .btn:disabled{opacity:.4}

  .prodc{display:flex; align-items:center; gap:8px; background:var(--panel2); border-radius:12px; padding:9px; margin-bottom:8px}
  .prodc .info{flex:1; min-width:0}
  .prodc .nom{font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .prodc .pre{font-size:12px; color:var(--mut)}
  .prodc .qty{
    min-width:42px; text-align:center; font-size:18px; font-weight:800;
    background:#0b1220; border-radius:8px; padding:6px 5px;
  }
  .qty.bajo{color:var(--ambar)} .qty.cero{color:var(--rojo)}
  .plus,.minus{
    width:44px; height:44px; border-radius:12px; border:none; font-size:23px; font-weight:800; color:#fff; cursor:pointer;
    flex-shrink:0;
  }
  .plus{background:var(--verde)} .minus{background:var(--rojo)}
  .editprecio{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--ambar);
    background:#0b1220; color:var(--ambar); font-size:16px; font-weight:800; cursor:pointer; flex-shrink:0;
  }
  .editprecio:active{filter:brightness(1.4)}
  .prodc{touch-action:none; -webkit-touch-callout:none}
  .prodc.dragging{
    position:relative; z-index:30; opacity:.95;
    box-shadow:0 10px 30px rgba(0,0,0,.65); background:#334155;
  }
  .plus:active,.minus:active{filter:brightness(1.25)}

  input,select{
    background:#0b1220; border:1px solid var(--line); color:var(--txt); border-radius:10px;
    padding:11px 12px; font-size:16px; width:100%; font-family:inherit;
  }
  input:focus,select:focus{outline:2px solid #0ea5e9; border-color:transparent}
  label{font-size:12.5px; color:var(--mut); font-weight:600; display:block; margin:8px 0 4px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}

  .vta{display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--line)}
  .vta:last-child{border-bottom:none}
  .vta .del{background:none; border:none; color:var(--rojo); font-size:20px; padding:6px; cursor:pointer}
  .tag{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:99px; letter-spacing:.4px; white-space:nowrap}
  .tag.mp{background:rgba(139,92,246,.2); color:#c4b5fd}
  .tag.ef{background:rgba(34,197,94,.18); color:var(--verde)}
  .tag.nf{background:rgba(245,158,11,.2); color:var(--ambar)}

  .metodos{display:flex; gap:8px}
  .metodos button{
    flex:1; padding:11px; border-radius:10px; border:2px solid var(--line); background:#0b1220;
    color:var(--mut); font-weight:700; font-size:14px; cursor:pointer;
  }
  .metodos button.ef.sel{border-color:var(--verde); color:var(--verde)}
  .metodos button.mp.sel{border-color:var(--violeta); color:#c4b5fd}
  .chk{display:flex; align-items:center; gap:10px; margin-top:10px; font-size:14px; font-weight:600; color:var(--txt); cursor:pointer}
  .chk input{width:20px; height:20px; accent-color:#22c55e}

  .bomba{background:var(--panel2); border-radius:12px; padding:10px 12px; margin-bottom:10px}
  .bomba .tit{font-weight:800; font-size:14px; margin-bottom:6px}
  .bomba .litros{font-size:12.5px; color:var(--mut); margin-top:6px}
  .grid-lect{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .grid-lect input{padding:8px 10px; font-size:15px}

  dialog{
    background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:16px;
    width:min(92vw,400px); padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  dialog::backdrop{background:rgba(0,0,0,.65)}
  dialog h3{margin:0 0 12px; font-size:17px}
  .acciones{display:flex; gap:10px; margin-top:16px}
  .acciones .btn{flex:1}
  .resline{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14.5px}
  .resline:last-child{border-bottom:none}
  .resline b{font-size:15px}
  .resline input{width:120px; text-align:right; padding:7px 10px; font-size:15px}
  .pesos{color:var(--mut); font-weight:800; font-size:15px}
  .toast{
    position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:#052e16; color:#86efac; border:1px solid #166534; padding:10px 20px; border-radius:99px;
    font-size:14px; font-weight:700; z-index:50; opacity:0; transition:opacity .25s; pointer-events:none;
    max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1}
  .vacío{text-align:center; color:var(--mut); padding:18px 0; font-size:14px}
  .hist{padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px}
  .hist:last-child{border-bottom:none}
  .subcard{background:#0b1220; border-radius:12px; padding:10px 12px; margin-top:10px}
</style>
</head>
<body>

<header>
  <h1>⛽ Stock Shell — Planilla de turno</h1>
  <div class="fecha" id="fecha"></div>
</header>

<main id="vista"></main>

<nav class="tabs">
  <button data-v="stock" class="act"><span class="ico">📦</span>Stock</button>
  <button data-v="ventas"><span class="ico">🛒</span>Ventas</button>
  <button data-v="mp"><span class="ico">🟣</span>Mercado Pago</button>
  <button data-v="comb"><span class="ico">⛽</span>Combustible</button>
  <button data-v="dia"><span class="ico">💰</span>Rendición</button>
</nav>

<div class="toast" id="toast"></div>

<dialog id="mProd">
  <h3 id="mProdTitulo">Producto</h3>
  <label>Nombre</label>
  <input id="fNombre" placeholder="Ej: Cinta aislante 10 M" maxlength="60">
  <div class="grid2">
    <div>
      <label>Cantidad en stock</label>
      <input id="fCant" type="number" inputmode="decimal" step="any" min="0" placeholder="0">
    </div>
    <div>
      <label>Precio unitario ($)</label>
      <input id="fPrecio" type="text" inputmode="decimal" placeholder="0,00">
    </div>
  </div>
  <div class="acciones">
    <button class="btn ghost" id="mProdCancelar">Cancelar</button>
    <button class="btn ok" id="mProdGuardar">Guardar</button>
  </div>
</dialog>

<dialog id="mVenta">
  <h3>Nueva venta</h3>
  <label>Producto / descripción</label>
  <input id="vDesc" list="listaProd" placeholder="Elegí o escribí…" maxlength="60">
  <datalist id="listaProd"></datalist>
  <div class="grid2">
    <div>
      <label>Cantidad</label>
      <input id="vCant" type="number" inputmode="decimal" step="any" min="0" value="1">
    </div>
    <div>
      <label>Precio unitario ($)</label>
      <input id="vPrecio" type="text" inputmode="decimal" placeholder="0,00">
    </div>
  </div>
  <label>Cobro</label>
  <div class="metodos">
    <button class="ef sel" id="vEf">💵 Efectivo</button>
    <button class="mp" id="vMp">🟣 Mercado Pago</button>
  </div>
  <label class="chk"><input type="checkbox" id="vFactura"> Con factura (C/F)</label>
  <div class="row between" style="margin-top:12px; background:#0b1220; border-radius:10px; padding:12px">
    <span class="mut">Total</span><b class="big" id="vTotal" style="font-size:22px">$ 0,00</b>
  </div>
  <div class="acciones">
    <button class="btn ghost" id="mVentaCancelar">Cancelar</button>
    <button class="btn ok" id="mVentaGuardar">Registrar</button>
  </div>
</dialog>

<dialog id="mComb">
  <h3>Carga suelta de combustible</h3>
  <label>Tipo</label>
  <select id="cTipo"></select>
  <label>Litros</label>
  <input id="cLitros" type="number" inputmode="decimal" step="any" min="0" placeholder="0">
  <label>Cobro</label>
  <div class="metodos">
    <button class="ef sel" id="cEf">💵 Efectivo</button>
    <button class="mp" id="cMp">🟣 Mercado Pago</button>
  </div>
  <div class="row between" style="margin-top:12px; background:#0b1220; border-radius:10px; padding:12px">
    <span class="mut">Total</span><b id="cTotal" style="font-size:22px">$ 0,00</b>
  </div>
  <div class="acciones">
    <button class="btn ghost" id="mCombCancelar">Cancelar</button>
    <button class="btn ok" id="mCombGuardar">Registrar</button>
  </div>
</dialog>

<dialog id="mCerrar">
  <h3>Cerrar el turno</h3>
  <p class="mut" style="font-size:14px; line-height:1.5">Se guarda el resumen de hoy en el historial y arranca el turno nuevo en cero. El stock y las lecturas de las bombas <b>no</b> se tocan.</p>
  <div id="cierreResumen"></div>
  <div class="acciones">
    <button class="btn ghost" id="mCerrarCancelar">Cancelar</button>
    <button class="btn ok" id="mCerrarOk">Cerrar turno</button>
  </div>
</dialog>

<script>
'use strict';

const LS = 'stockshell_v1';
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let db = null;
let metodoVenta = 'efectivo', metodoComb = 'efectivo';
let editProdId = null;

const fmt  = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n||0);
const fmtN = n => new Intl.NumberFormat('es-AR',{maximumFractionDigits:2}).format(n||0);
const num  = v => {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v).trim().replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const hoyISO = () => new Date().toISOString().slice(0,10);
const FECHAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES  = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function base(){
  const P = (nombre, cant) => ({id:uid(), nombre, cant, precio:0});
  return {
    productos: [
      P('Estopa', 5),
      P('Filtros', 25),
      P('Arranque motor RAN', 15),
      P('Arranque motor BARD', 0),
      P('Cinta aislante 5 M', 9),
      P('Cinta aislante 10 M', 12),
      P('Cinta aislante 20 M', 4),
      P('Limpiainy. INJECT', 0),
      P('Limpiainy. x 250', 5),
      P('Bardahl Flex', 0),
      P('Sol Drin', 6),
      P('Grasa 30 C', 0),
      P('Grasa 62 EP', 0),
      P('Agua form. x 5 V', 3),
      P('Agua form. x 6 V', 4),
      P('Agua destilada x 1 L', 3),
      P('Agua destilada x 2 L', 5),
      P('Agua destilada x 5 L', 13),
      P('Agua destilada x 10 L', 2),
      P('Escobilla', 0),
      P('Fusibles mini', 4),
      P('Wagner x 200', 17),
      P('Líq. frenos x 500', 9),
      P('Amarilla x 1000', 6),
      P('YPF Moto 2T 200 cc', 5),
      P('Castrol 2T x 100', 13),
      P('Anticongelante 1 kg', 2),
      P('Fusibles ficha F-18', 1),
      P('Grasa 150 g', 2),
      P('Rodante 20W50', 5),
      P('YPF Náutica cadena 220', 0),
      P('Náutica 2T x 500', 14),
      P('Náutica 2T x 1000', 3),
      P('ACT x 1000', 6),
      P('ESE x 1000', 8),
      P('Wagner org.', 9),
      P('Wagner x 1 L', 7),
      P('Buma', 2),
      P('Norma x 1 L', 45),
      P('Elaion 10W40', 2),
      P('Elaion Vida 15W40', 10),
      P('Trans 90', 4),
      P('Hidráulico x 1 L', 12),
      P('ATF x 1 L', 7),
      P('Super 20W50', 5),
      P('Elaion F10 x 1 L', 3),
      P('Parolupa', 2),
      P('Hipodal 80W90', 10),
      P('Super 20W50 x 1 L', 2),
      P('Freno x 500 cc', 2),
      P('Freno x 1 L', 6),
      P('XV 300 15W40 x 1 L', 3),
      P('Lámpara H7', 1),
      P('Lámpara H4', 10),
      P('Hielo x bolsa', 75),
      P('Gas x garrafa', 19),
    ],
    preciosComb: {'Nafta Súper':2939, 'Gas Oil':2949},
    bombas: [
      {id:'S1', tipo:'Nafta Súper', ini:204654.18, fin:null},
      {id:'S3', tipo:'Gas Oil',     ini:635793.40, fin:null},
    ],
    ventas: [],
    v: 2,
    comisionMP: 3.19,
    rendicion: {pesos:0, ctacte:0, tarjetas:0, gastos:0, retiros:0},
    historial: []
  };
}
function cargar(){
  try{
    const d = JSON.parse(localStorage.getItem(LS));
    if (d && Array.isArray(d.productos)){
      const b = base();
      const merged = Object.assign(b, d);
      merged.bombas = merged.bombas.filter(x=>b.bombas.some(bb=>bb.id===x.id));
      if (!merged.bombas.length) merged.bombas = b.bombas;
      merged.preciosComb = Object.assign({}, b.preciosComb, merged.preciosComb);
      TIPOS_COMB.forEach(t=>{ if (!(t in merged.preciosComb)) merged.preciosComb[t]=0; });
      if (!d.v){
        merged.ventas = (merged.ventas||[]).map(v=>(v.metodo==='mp' && !v.origen) ? Object.assign({}, v, {origen:'mp'}) : v);
        merged.v = 2;
      }
      return merged;
    }
  }catch(e){}
  return base();
}
function guardar(){ localStorage.setItem(LS, JSON.stringify(db)); }

function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- helpers de datos ---------- */
const delDia   = () => db.ventas.filter(v => v.fecha === hoyISO());
const totalMet = m => delDia().filter(v=>v.metodo===m).reduce((a,v)=>a+v.total,0);
const combCargas  = () => delDia().filter(v=>v.comb).reduce((a,v)=>a+v.total,0);
const totalVentCF = () => delDia().filter(v=>v.factura).reduce((a,v)=>a+v.total,0);
const totalVentSF = () => delDia().filter(v=>!v.factura).reduce((a,v)=>a+v.total,0);
const totalBombas = () => db.bombas.reduce((a,b)=>a + Math.max(0,(num(b.fin)-num(b.ini))) * (db.preciosComb[b.tipo]||0), 0);
const totalComb   = () => combCargas() + totalBombas();
const totalDia    = () => delDia().reduce((a,v)=>a+v.total,0);
const totalRend   = () => { const r = db.rendicion; return num(r.pesos)+num(r.ctacte)+totalMet('mp')+num(r.gastos)+num(r.retiros); };
const totalTurno  = () => totalDia() + totalBombas();

/* ---------- pestañas ---------- */
let vistaActual = 'stock';
$$('.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>{
    vistaActual = b.dataset.v;
    $$('.tabs button').forEach(x=>x.classList.toggle('act', x===b));
    render();
    window.scrollTo(0,0);
  });
});

function render(){
  $('#fecha').textContent = (()=>{
    const d = new Date();
    return `${FECHAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]} — ${totalDia()>0 ? 'Vendido: '+fmt(totalDia()) : 'sin ventas todavía'}`;
  })();
  ({stock:vStock, ventas:vVentas, mp:vMP, comb:vComb, dia:vDia})[vistaActual]();
}

/* ---------- STOCK ---------- */
function vStock(){
  const m = $('#vista');
  m.innerHTML = `
    <div class="card">
      <div class="row between">
        <h2>📦 Stock <span class="mut" style="text-transform:none">(${db.productos.length})</span></h2>
        <span class="mut" style="font-size:12px">tocá el nombre para editar · mantené apretado y arrastrá para ordenar ↑↓</span>
      </div>
      <div class="row between" style="background:#0b1220; border-radius:10px; padding:10px 12px; margin-bottom:10px">
        <span class="mut">Valor total del stock</span><b class="verde" style="font-size:17px" id="valStockLista"></b>
      </div>
      <div id="listaProd2"></div>
    </div>
    <button class="btn ok grande" onclick="abrirProd()">+ Agregar producto</button>`;
  const valStock = db.productos.reduce((a,p)=>a + p.cant*p.precio, 0);
  $('#valStockLista').textContent = fmt(valStock);
  const cont = $('#listaProd2');
  db.productos.forEach(p=>{
    const d = document.createElement('div');
    d.className = 'prodc';
    d.dataset.pid = p.id;
    const cls = p.cant<=0 ? 'cero' : p.cant<=3 ? 'bajo' : '';
    d.innerHTML = `
      <div class="info" data-edit="${p.id}">
        <div class="nom">${esc(p.nombre)}</div>
        <div class="pre">${p.precio>0 ? fmt(p.precio)+' c/u · Total '+fmt(p.cant*p.precio) : 'tocá $ para poner el precio'}</div>
      </div>
      <div class="qty ${cls}">${fmtN(p.cant)}</div>
      <button class="editprecio" data-pprecio="${p.id}" aria-label="cambiar precio">$</button>
      <button class="minus" aria-label="restar">−</button>
      <button class="plus"  aria-label="sumar">+</button>`;
    d.querySelector('.plus').onclick  = ()=>{ p.cant = +(p.cant+1).toFixed(2); guardar(); render(); };
    d.querySelector('.minus').onclick = ()=>{ p.cant = Math.max(0, +(p.cant-1).toFixed(2)); guardar(); render(); };
    d.querySelector('[data-edit]').onclick = ()=>abrirProd(p.id);
    d.querySelector('[data-pprecio]').onclick = ()=>{
      const v = prompt('Precio unitario de "'+p.nombre+'" ($):', p.precio>0?String(p.precio).replace('.',','):'');
      if (v===null) return;
      p.precio = num(v); guardar(); render(); toast('Precio guardado ✓');
    };
    cont.appendChild(d);
    attachDrag(d);
  });
}

function abrirProd(id){
  editProdId = id || null;
  const p = id ? db.productos.find(x=>x.id===id) : null;
  $('#mProdTitulo').textContent = p ? 'Editar producto' : 'Nuevo producto';
  $('#fNombre').value = p ? p.nombre : '';
  $('#fCant').value   = p ? p.cant : '';
  $('#fPrecio').value = p && p.precio ? String(p.precio).replace('.',',') : '';
  $('#mProd').showModal();
  setTimeout(()=>$('#fNombre').focus(), 50);
}
$('#mProdCancelar').onclick = ()=>$('#mProd').close();

/* ---------- reordenar: mantener apretado y arrastrar (pointer events) ---------- */
let skipClick = false;

function fmtMiles(v){
  const n = num(v);
  if (!n) return '';
  const neg = n < 0 ? '-' : '';
  const [ent, dec] = Math.abs(n).toFixed(2).split('.');
  const entG = ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const decL = dec.replace(/0+$/,'');
  return neg + entG + (decL ? ',' + decL : '');
}

function persistOrder(){
  const cont = $('#listaProd2');
  if (!cont) return;
  const ids = [...cont.children].map(r=>r.dataset.pid);
  db.productos.sort((a,b)=>ids.indexOf(a.id) - ids.indexOf(b.id));
  guardar();
}

function attachDrag(row){
  let timer = null, activado = false, anclaY = 0, lastY = 0;

  row.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    activado = false;
    anclaY = lastY = e.clientY;
    try{ row.setPointerCapture(e.pointerId); }catch(err){}
    clearTimeout(timer);
    timer = setTimeout(()=>{
      activado = true;
      skipClick = true;
      anclaY = lastY;
      row.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(40);
    }, 300);
  });

  row.addEventListener('pointermove', e => {
    lastY = e.clientY;
    if (!activado) return;
    e.preventDefault();
    let offset = e.clientY - anclaY;
    row.style.transform = 'translateY(' + offset + 'px)';

    const arriba = row.previousElementSibling, abajo = row.nextElementSibling;
    if (arriba && offset < 0 && row.getBoundingClientRect().top < arriba.getBoundingClientRect().top + arriba.offsetHeight*0.45){
      const salto = row.getBoundingClientRect().top;
      arriba.after(row);
      anclaY += row.getBoundingClientRect().top - salto;
      offset = e.clientY - anclaY;
      row.style.transform = 'translateY(' + offset + 'px)';
    } else if (abajo && offset > 0 && row.getBoundingClientRect().bottom > abajo.getBoundingClientRect().top + abajo.offsetHeight*0.45){
      const salto = row.getBoundingClientRect().top;
      row.after(abajo);
      anclaY += row.getBoundingClientRect().top - salto;
      offset = e.clientY - anclaY;
      row.style.transform = 'translateY(' + offset + 'px)';
    }

    if (e.clientY < 90){ window.scrollBy(0,-14); anclaY += 14; }
    else if (e.clientY > window.innerHeight - 90){ window.scrollBy(0,14); anclaY -= 14; }
  });

  const soltar = () => {
    clearTimeout(timer);
    if (activado){
      activado = false;
      row.classList.remove('dragging');
      row.style.transform = '';
      persistOrder();
      setTimeout(()=>{ skipClick = false; }, 400);
    }
  };
  row.addEventListener('pointerup', soltar);
  row.addEventListener('pointercancel', soltar);
  row.addEventListener('contextmenu', e => e.preventDefault());
}

const _abrirProd = abrirProd;
abrirProd = function(id){
  if (skipClick) return;
  _abrirProd(id);
};

/* ---------- service worker (para "Instalar aplicación" / APK) ---------- */
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

db = cargar();
render();
</script>
